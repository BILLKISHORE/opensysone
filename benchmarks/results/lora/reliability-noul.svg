<polyline points="240.9,166.2 277.6,135.8 308.1,106.5 342.6,100.2 382.2,60.4" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="240.9" cy="166.2" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>raw, confidence 0.5 to 0.6: n=72, mean confidence 0.55, accuracy 0.57</title></circle>
