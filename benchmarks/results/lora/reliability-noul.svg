<circle cx="308.1" cy="106.5" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.7 to 0.8: n=76, mean confidence 0.75, accuracy 0.80</title></circle>
<circle cx="342.6" cy="100.2" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.8 to 0.9: n=81, mean confidence 0.85, accuracy 0.83</title></circle>
