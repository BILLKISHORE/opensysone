<circle cx="214.6" cy="203.7" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.4 to 0.5: n=26, mean confidence 0.47, accuracy 0.42</title></circle>
