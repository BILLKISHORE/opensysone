<circle cx="213.9" cy="184.0" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.4 to 0.5: n=40, mean confidence 0.47, accuracy 0.50</title></circle>
