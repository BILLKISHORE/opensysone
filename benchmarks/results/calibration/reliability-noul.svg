<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Reliability diagram, noul">
<title>Reliability diagram, noul</title>
<style>
.viz{--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){.viz{--surface:#1a1a19;--text:#ffffff;--text2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926}}
.viz text{font-family:system-ui,-apple-system,sans-serif}
</style>
<rect width="480" height="360" fill="var(--surface)"/>
<text x="56" y="20" font-size="14" font-weight="600" fill="var(--text)">noul</text>
<line x1="56.0" y1="312.0" x2="392.0" y2="312.0" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="316.0" font-size="11" fill="var(--muted)" text-anchor="end">0.0</text>
<text x="56.0" y="330" font-size="11" fill="var(--muted)" text-anchor="middle">0.0</text>
<line x1="56.0" y1="260.8" x2="392.0" y2="260.8" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="264.8" font-size="11" fill="var(--muted)" text-anchor="end">0.2</text>
<text x="123.2" y="330" font-size="11" fill="var(--muted)" text-anchor="middle">0.2</text>
<line x1="56.0" y1="209.6" x2="392.0" y2="209.6" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="213.6" font-size="11" fill="var(--muted)" text-anchor="end">0.4</text>
<text x="190.4" y="330" font-size="11" fill="var(--muted)" text-anchor="middle">0.4</text>
<line x1="56.0" y1="158.4" x2="392.0" y2="158.4" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="162.4" font-size="11" fill="var(--muted)" text-anchor="end">0.6</text>
<text x="257.6" y="330" font-size="11" fill="var(--muted)" text-anchor="middle">0.6</text>
<line x1="56.0" y1="107.2" x2="392.0" y2="107.2" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="111.2" font-size="11" fill="var(--muted)" text-anchor="end">0.8</text>
<text x="324.8" y="330" font-size="11" fill="var(--muted)" text-anchor="middle">0.8</text>
<line x1="56.0" y1="56.0" x2="392.0" y2="56.0" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="60.0" font-size="11" fill="var(--muted)" text-anchor="end">1.0</text>
<text x="392.0" y="330" font-size="11" fill="var(--muted)" text-anchor="middle">1.0</text>
<line x1="56.0" y1="312.0" x2="392.0" y2="312.0" stroke="var(--axis)" stroke-width="1"/>
<line x1="56.0" y1="312.0" x2="392.0" y2="56.0" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="224.0" y="352" font-size="12" fill="var(--muted)" text-anchor="middle">mean confidence</text>
<text x="14" y="184.0" font-size="12" fill="var(--muted)" text-anchor="middle" transform="rotate(-90 14 184.0)">accuracy</text>
<rect x="56" y="32" width="10" height="10" rx="2" fill="var(--s1)"/><text x="72" y="41" font-size="12" fill="var(--text2)">raw</text><rect x="116" y="32" width="10" height="10" rx="2" fill="var(--s2)"/><text x="132" y="41" font-size="12" fill="var(--text2)">calibrated</text>
<polyline points="241.5,161.0 274.7,106.8 305.3,61.8 335.7,56.0" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="241.5" cy="161.0" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>raw, confidence 0.5 to 0.6: n=156, mean confidence 0.55, accuracy 0.59</title></circle>
<circle cx="274.7" cy="106.8" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>raw, confidence 0.6 to 0.7: n=232, mean confidence 0.65, accuracy 0.80</title></circle>
<circle cx="305.3" cy="61.8" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>raw, confidence 0.7 to 0.8: n=176, mean confidence 0.74, accuracy 0.98</title></circle>
<circle cx="335.7" cy="56.0" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>raw, confidence 0.8 to 0.9: n=36, mean confidence 0.83, accuracy 1.00</title></circle>
<polyline points="239.3,181.3 275.9,150.7 308.6,134.4 340.9,94.4 381.4,61.4" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="239.3" cy="181.3" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.5 to 0.6: n=47, mean confidence 0.55, accuracy 0.51</title></circle>
<circle cx="275.9" cy="150.7" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.6 to 0.7: n=73, mean confidence 0.65, accuracy 0.63</title></circle>
<circle cx="308.6" cy="134.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.7 to 0.8: n=98, mean confidence 0.75, accuracy 0.69</title></circle>
<circle cx="340.9" cy="94.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.8 to 0.9: n=100, mean confidence 0.85, accuracy 0.85</title></circle>
<circle cx="381.4" cy="61.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>calibrated, confidence 0.9 to 1.0: n=282, mean confidence 0.97, accuracy 0.98</title></circle>
<text x="400.0" y="55.7" font-size="12" fill="var(--text2)">raw</text>
<text x="400.0" y="69.7" font-size="12" fill="var(--text2)">calibrated</text>
