[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensysone"
version = "0.0.1"
description = "Open System One model: typed decisions with calibrated probabilities from one forward pass, on Apple Silicon."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "BILLKISHORE" }]
keywords = ["mlx", "apple-silicon", "decisions", "calibration", "system-one"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jevmlx @ git+https://github.com/bnsd55/jevmlx@5449b648c892521036d68a60fa6e3fb81e755cac",
    "mlx-lm>=0.31.3",
]

[project.urls]
Repository = "https://github.com/BILLKISHORE/opensysone"

[tool.hatch.build.targets.wheel]
packages = ["src/opensysone"]
